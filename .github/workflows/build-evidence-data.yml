name: Build and commit evidence data

on:
  push:
    branches: [main]
    paths:
      - "prepare_data.py"
      - "verify_evidence.py"
      - "requirements.txt"
      - ".github/workflows/build-evidence-data.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-data:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Build evidence data
        run: python prepare_data.py --download

      - name: Verify evidence
        run: python verify_evidence.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Add verified PrivacyGuard evidence data"
            git push
          fi
